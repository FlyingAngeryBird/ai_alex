<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lingmo 音乐播放 UI 稿 v1</title>
    <style>
      :root {
        color: #f8f4ea;
        background: #07080d;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(118deg, rgba(255, 218, 118, 0.08), transparent 34%),
          linear-gradient(242deg, rgba(0, 214, 200, 0.1), transparent 38%),
          linear-gradient(180deg, #0a0b11 0%, #05060a 58%, #09070b 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), transparent 72%);
      }

      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }

      .music-view {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100%;
        padding: 30px 40px 38px;
        overflow: hidden;
      }

      .particle-stage {
        position: absolute;
        inset: -4% 0 20%;
        pointer-events: none;
        opacity: 0.9;
      }

      .particle-core {
        position: absolute;
        top: 12%;
        left: 50%;
        width: min(38vw, 410px);
        aspect-ratio: 1;
        transform: translateX(-50%);
        border-radius: 999px;
        background:
          radial-gradient(circle at 48% 48%, rgba(255, 247, 230, 0.98) 0 1px, transparent 2px),
          radial-gradient(circle at 38% 42%, rgba(0, 213, 200, 0.8), transparent 12%),
          radial-gradient(circle at 62% 58%, rgba(255, 225, 111, 0.62), transparent 14%),
          radial-gradient(circle, rgba(143, 228, 203, 0.14), transparent 62%);
        filter: drop-shadow(0 0 26px rgba(0, 213, 200, 0.16));
      }

      .particle-core::before,
      .particle-core::after {
        position: absolute;
        inset: -8%;
        content: "";
        border: 1px solid rgba(143, 228, 203, 0.2);
        border-radius: 999px;
        transform: rotate(-18deg) scaleX(1.18);
      }

      .particle-core::after {
        inset: -16%;
        border-color: rgba(255, 225, 111, 0.14);
        transform: rotate(24deg) scaleX(1.28);
      }

      .beat-ring {
        position: absolute;
        inset: -24%;
        border: 1px solid rgba(255, 225, 111, 0.12);
        border-radius: 999px;
        box-shadow:
          0 0 34px rgba(255, 225, 111, 0.08),
          inset 0 0 40px rgba(0, 213, 200, 0.06);
        transform: rotate(8deg) scaleX(1.36);
      }

      .music-topbar {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(280px, 430px);
        align-items: start;
        gap: 16px;
        color: #cfd6d0;
        font-size: 0.82rem;
      }

      .top-left {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 42px;
      }

      .round-button,
      .exit-button,
      .search-button,
      .source-chip,
      .primary-play-button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        cursor: pointer;
      }

      .round-button {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 999px;
        color: #fff8e6;
        background: rgba(255, 255, 255, 0.06);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 225, 111, 0.18);
        border-radius: 999px;
        background: rgba(255, 225, 111, 0.07);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ffe16f;
        box-shadow: 0 0 14px rgba(255, 225, 111, 0.9);
      }

      .exit-button {
        height: 34px;
        min-width: 64px;
        padding: 0 12px;
        border-radius: 12px;
        color: #fff8e6;
        background: rgba(255, 143, 100, 0.12);
      }

      .search-glass {
        justify-self: end;
        width: 100%;
        max-width: 430px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
          rgba(7, 8, 12, 0.34);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 18px 48px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(24px) saturate(1.25);
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .search-field {
        min-width: 0;
        height: 34px;
        padding: 0 11px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 11px;
        color: #f8f4ea;
        background: rgba(255, 255, 255, 0.055);
        outline: none;
      }

      .search-field::placeholder {
        color: rgba(232, 229, 216, 0.56);
      }

      .search-button {
        height: 34px;
        padding: 0 12px;
        border-radius: 11px;
        color: #07100f;
        background: rgba(169, 240, 223, 0.82);
        font-weight: 700;
      }

      .source-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }

      .source-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 58px;
        height: 26px;
        padding: 0 9px;
        border-radius: 999px;
        color: #dcd7ca;
        background: rgba(255, 255, 255, 0.052);
        font-size: 0.72rem;
      }

      .source-chip[data-active="true"] {
        border-color: rgba(255, 225, 111, 0.38);
        color: #fff4d4;
        background: rgba(255, 225, 111, 0.12);
      }

      .music-layout {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(290px, 430px) minmax(260px, 360px);
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 4vw, 54px);
        min-height: 0;
      }

      .cover-frame {
        position: relative;
      }

      .cover-art {
        display: grid;
        width: 100%;
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(145deg, rgba(255, 225, 111, 0.88), rgba(255, 111, 145, 0.7) 48%, rgba(0, 213, 200, 0.78)),
          #151512;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.44);
      }

      .cover-art::before {
        width: 64%;
        aspect-ratio: 1;
        content: "";
        border: 1px solid rgba(5, 6, 10, 0.18);
        border-radius: 999px;
        background:
          radial-gradient(circle, rgba(5, 6, 10, 0.16) 0 9%, transparent 10%),
          repeating-radial-gradient(circle, rgba(5, 6, 10, 0.18) 0 1px, transparent 2px 11px);
      }

      .cover-label {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 999px;
        color: rgba(255, 248, 230, 0.86);
        background: rgba(5, 6, 10, 0.28);
        font-size: 0.72rem;
        backdrop-filter: blur(10px);
      }

      .music-copy {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #96ded5;
        font-size: 0.64rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h2 {
        max-width: 100%;
        color: #fff5dc;
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(2.8rem, 6vw, 5rem);
        font-weight: 650;
        line-height: 0.96;
        overflow-wrap: anywhere;
      }

      .artist {
        margin-top: 12px;
        color: #c8d0c8;
        font-size: clamp(1rem, 2vw, 1.28rem);
      }

      .recommendation {
        max-width: 31rem;
        margin-top: 20px;
        color: #d8cdb8;
        font-size: 0.96rem;
        line-height: 1.68;
      }

      .progress-block {
        margin-top: 28px;
      }

      .progress-track {
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .progress-track span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #ffe16f;
        box-shadow: 0 0 16px rgba(255, 225, 111, 0.45);
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: #9ea79f;
        font-size: 0.78rem;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }

      .primary-play-button {
        min-width: 92px;
        height: 34px;
        padding: 0 13px;
        border-radius: 12px;
        color: #fff8e6;
        background: rgba(255, 225, 111, 0.1);
        font-size: 0.78rem;
      }

      .source-note {
        color: rgba(232, 229, 216, 0.54);
        font-size: 0.76rem;
      }

      .lyric-panel {
        min-width: 0;
        padding: 18px 18px 18px 20px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
      }

      .lyric-stack {
        display: grid;
        gap: 13px;
        align-content: center;
        min-width: 0;
      }

      .lyric-line {
        color: rgba(232, 229, 216, 0.44);
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(1rem, 1.55vw, 1.3rem);
        line-height: 1.48;
        overflow-wrap: anywhere;
      }

      .lyric-line[data-current="true"] {
        color: #fff4d4;
        text-shadow: 0 0 20px rgba(255, 225, 111, 0.22);
        transform: translateX(6px);
      }

      @media (max-width: 980px) {
        .music-view {
          padding: 22px 24px 28px;
        }

        .music-topbar {
          grid-template-columns: 1fr;
        }

        .search-glass {
          justify-self: stretch;
          max-width: none;
        }

        .music-layout {
          grid-template-columns: minmax(190px, 260px) minmax(260px, 1fr);
          grid-template-rows: auto auto;
          gap: 24px;
        }

        .lyric-panel {
          grid-column: 2;
          padding: 0;
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="music-view">
      <div class="particle-stage" aria-hidden="true">
        <div class="particle-core">
          <div class="beat-ring"></div>
        </div>
      </div>

      <header class="music-topbar">
        <div class="top-left">
          <button class="round-button" type="button">←</button>
          <div class="status-pill"><span class="status-dot"></span>Playing</div>
          <button class="exit-button" type="button">退出</button>
        </div>
        <div></div>
        <section class="search-glass" aria-label="歌曲搜索">
          <div class="search-row">
            <input class="search-field" value="稻香 周杰伦" aria-label="搜索歌曲、歌手或专辑" />
            <button class="search-button" type="button">搜索</button>
          </div>
          <div class="source-row" aria-label="音源选择">
            <button class="source-chip" data-active="true" type="button">全部音源</button>
            <button class="source-chip" type="button">netease</button>
            <button class="source-chip" type="button">kuwo</button>
            <button class="source-chip" type="button">joox</button>
          </div>
        </section>
      </header>

      <section class="music-layout">
        <div class="cover-frame">
          <div class="cover-art" aria-label="专辑封面"></div>
          <span class="cover-label">专辑图</span>
        </div>

        <div class="music-copy">
          <p class="eyebrow">GD Studio · joox</p>
          <h2>稻香</h2>
          <p class="artist">周杰伦 · 魔杰座</p>
          <p class="recommendation">
            已从全部音源中找到可播放版本。灵粒会优先同步歌词，如果歌词缺失，就保留歌曲信息和推荐语。
          </p>

          <div class="progress-block">
            <div class="progress-track" aria-hidden="true"><span></span></div>
            <div class="time-row"><span>1:24</span><span>3:43</span></div>
          </div>

          <div class="control-row">
            <button class="primary-play-button" type="button">暂停</button>
            <span class="source-note">空链接时自动换下一首 / 下一源</span>
          </div>
        </div>

        <aside class="lyric-panel" aria-label="同步歌词">
          <div class="lyric-stack">
            <p class="lyric-line">对这个世界如果你有太多的抱怨</p>
            <p class="lyric-line">跌倒了就不敢继续往前走</p>
            <p class="lyric-line" data-current="true">为什么人要这么的脆弱堕落</p>
            <p class="lyric-line">请你打开电视看看</p>
            <p class="lyric-line">多少人为生命在努力勇敢的走下去</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
