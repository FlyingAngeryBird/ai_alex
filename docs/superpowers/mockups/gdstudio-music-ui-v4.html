<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lingmo 音乐播放 UI 稿 v4</title>
    <style>
      :root {
        color: #f8f4ea;
        background: #07080d;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(118deg, rgba(255, 218, 118, 0.075), transparent 34%),
          linear-gradient(242deg, rgba(0, 214, 200, 0.095), transparent 38%),
          linear-gradient(180deg, #0a0b11 0%, #05060a 58%, #09070b 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.033) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), transparent 72%);
      }

      button,
      input {
        color: inherit;
        font: inherit;
      }

      .music-view {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 30px 40px 38px;
        overflow: hidden;
      }

      .particle-stage {
        position: absolute;
        inset: -4% 0 18%;
        pointer-events: none;
        opacity: 0.92;
      }

      .particle-core {
        position: absolute;
        top: 12%;
        left: 50%;
        width: min(38vw, 410px);
        aspect-ratio: 1;
        transform: translateX(-50%);
        border-radius: 999px;
        background:
          radial-gradient(circle at 48% 48%, rgba(255, 247, 230, 0.98) 0 1px, transparent 2px),
          radial-gradient(circle at 38% 42%, rgba(0, 213, 200, 0.8), transparent 12%),
          radial-gradient(circle at 62% 58%, rgba(255, 225, 111, 0.62), transparent 14%),
          radial-gradient(circle, rgba(143, 228, 203, 0.14), transparent 62%);
        filter: drop-shadow(0 0 26px rgba(0, 213, 200, 0.16));
      }

      .particle-core::before,
      .particle-core::after {
        position: absolute;
        inset: -8%;
        content: "";
        border: 1px solid rgba(143, 228, 203, 0.18);
        border-radius: 999px;
        transform: rotate(-18deg) scaleX(1.18);
      }

      .particle-core::after {
        inset: -16%;
        border-color: rgba(255, 225, 111, 0.12);
        transform: rotate(24deg) scaleX(1.28);
      }

      .beat-ring {
        position: absolute;
        inset: -24%;
        border: 1px solid rgba(255, 225, 111, 0.115);
        border-radius: 999px;
        box-shadow:
          0 0 34px rgba(255, 225, 111, 0.075),
          inset 0 0 40px rgba(0, 213, 200, 0.055);
        transform: rotate(8deg) scaleX(1.36);
      }

      .beat-ring::before {
        position: absolute;
        inset: 11%;
        content: "";
        border: 1px solid rgba(0, 213, 200, 0.08);
        border-radius: inherit;
        transform: rotate(-24deg) scaleX(0.9);
      }

      .topbar {
        position: relative;
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      .top-left {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 42px;
      }

      .round-button,
      .exit-button,
      .search-button,
      .source-chip,
      .icon-play-button {
        border: 1px solid rgba(255, 255, 255, 0.13);
        cursor: pointer;
      }

      .round-button {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 999px;
        color: #fff8e6;
        background: rgba(255, 255, 255, 0.055);
        backdrop-filter: blur(18px);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 225, 111, 0.17);
        border-radius: 999px;
        color: rgba(255, 248, 230, 0.9);
        background: rgba(255, 225, 111, 0.065);
        backdrop-filter: blur(18px);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ffe16f;
        box-shadow: 0 0 14px rgba(255, 225, 111, 0.85);
      }

      .exit-button {
        height: 34px;
        min-width: 64px;
        padding: 0 12px;
        border-radius: 12px;
        color: rgba(255, 248, 230, 0.92);
        background: rgba(255, 143, 100, 0.105);
        backdrop-filter: blur(18px);
      }

      .right-rail {
        width: 330px;
      }

      .search-glass {
        width: 100%;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.085);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.052), rgba(255, 255, 255, 0.012)),
          rgba(7, 8, 12, 0.2);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          0 14px 34px rgba(0, 0, 0, 0.13);
        backdrop-filter: blur(24px) saturate(1.2);
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 32px;
        gap: 6px;
        align-items: center;
      }

      .search-field {
        min-width: 0;
        height: 31px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        color: #f8f4ea;
        background: rgba(255, 255, 255, 0.035);
        outline: none;
      }

      .search-field::placeholder {
        color: rgba(232, 229, 216, 0.45);
      }

      .search-button {
        display: grid;
        width: 32px;
        height: 31px;
        place-items: center;
        border-radius: 10px;
        color: #07100f;
        background: rgba(169, 240, 223, 0.68);
        font-weight: 700;
      }

      .source-row {
        display: flex;
        gap: 5px;
        margin-top: 6px;
      }

      .source-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 48px;
        height: 23px;
        padding: 0 8px;
        border-radius: 999px;
        color: rgba(220, 215, 202, 0.7);
        background: rgba(255, 255, 255, 0.032);
        font-size: 0.68rem;
      }

      .source-chip[data-active="true"] {
        border-color: rgba(255, 225, 111, 0.3);
        color: #fff4d4;
        background: rgba(255, 225, 111, 0.09);
      }

      .track-strip {
        position: absolute;
        z-index: 3;
        left: clamp(40px, 9vw, 130px);
        bottom: clamp(70px, 12vh, 112px);
        width: min(360px, 34vw);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #96ded5;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        color: #fff5dc;
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(1.8rem, 3.1vw, 2.55rem);
        font-weight: 650;
        line-height: 1.02;
        overflow-wrap: anywhere;
      }

      .artist {
        margin-top: 7px;
        color: #c8d0c8;
        font-size: 0.94rem;
      }

      .progress-block {
        margin-top: 22px;
      }

      .progress-track {
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.105);
      }

      .progress-track span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #ffe16f;
        box-shadow: 0 0 14px rgba(255, 225, 111, 0.42);
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        color: #9ea79f;
        font-size: 0.72rem;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }

      .icon-play-button {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 999px;
        color: #fff8e6;
        background: rgba(255, 255, 255, 0.058);
        backdrop-filter: blur(16px);
      }

      .pause-bars {
        display: grid;
        grid-template-columns: 3px 3px;
        gap: 4px;
      }

      .pause-bars span {
        width: 3px;
        height: 12px;
        border-radius: 999px;
        background: #fff8e6;
      }

      .source-note {
        color: rgba(232, 229, 216, 0.46);
        font-size: 0.7rem;
      }

      .lyrics {
        position: absolute;
        z-index: 3;
        top: 45%;
        right: 40px;
        width: 330px;
        transform: translateY(-50%);
      }

      .lyric-stack {
        display: grid;
        gap: 13px;
        align-content: center;
        min-width: 0;
      }

      .lyric-line {
        margin: 0;
        color: rgba(232, 229, 216, 0.42);
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(0.98rem, 1.38vw, 1.2rem);
        line-height: 1.48;
        overflow-wrap: anywhere;
      }

      .lyric-line[data-current="true"] {
        color: #fff4d4;
        font-size: clamp(1.35rem, 2.05vw, 1.76rem);
        line-height: 1.24;
        text-shadow: 0 0 22px rgba(255, 225, 111, 0.24);
      }

      @media (max-width: 980px) {
        .music-view {
          padding: 22px 24px 28px;
        }

        .topbar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .right-rail,
        .lyrics,
        .track-strip {
          width: calc(100vw - 48px);
        }

        .particle-core {
          width: min(58vw, 360px);
        }

        .lyrics {
          top: 58%;
          right: 24px;
        }

        .track-strip {
          left: 24px;
          bottom: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="music-view">
      <div class="particle-stage" aria-hidden="true">
        <div class="particle-core">
          <div class="beat-ring"></div>
        </div>
      </div>

      <header class="topbar">
        <div class="top-left">
          <button class="round-button" type="button">←</button>
          <div class="status-pill"><span class="status-dot"></span>Playing</div>
          <button class="exit-button" type="button">退出</button>
        </div>
        <div class="right-rail">
          <section class="search-glass" aria-label="歌曲搜索">
            <div class="search-row">
              <input class="search-field" value="稻香 周杰伦" aria-label="搜索歌曲、歌手或专辑" />
              <button class="search-button" type="button">⌕</button>
            </div>
            <div class="source-row" aria-label="音源选择">
              <button class="source-chip" data-active="true" type="button">全部</button>
              <button class="source-chip" type="button">netease</button>
              <button class="source-chip" type="button">kuwo</button>
              <button class="source-chip" type="button">joox</button>
            </div>
          </section>
        </div>
      </header>

      <section class="track-strip" aria-label="播放信息">
        <p class="eyebrow">GD Studio · joox</p>
        <h1>稻香</h1>
        <p class="artist">周杰伦 · 魔杰座</p>
        <div class="progress-block">
          <div class="progress-track" aria-hidden="true"><span></span></div>
          <div class="time-row"><span>1:24</span><span>3:43</span></div>
        </div>
        <div class="control-row">
          <button class="icon-play-button" type="button" aria-label="暂停">
            <span class="pause-bars"><span></span><span></span></span>
          </button>
          <span class="source-note">空链接时自动换下一首 / 下一源</span>
        </div>
      </section>

      <aside class="lyrics" aria-label="同步歌词">
        <div class="lyric-stack">
          <p class="lyric-line">对这个世界如果你有太多的抱怨</p>
          <p class="lyric-line">跌倒了就不敢继续往前走</p>
          <p class="lyric-line" data-current="true">为什么人要这么的脆弱堕落</p>
          <p class="lyric-line">请你打开电视看看</p>
          <p class="lyric-line">多少人为生命在努力勇敢的走下去</p>
        </div>
      </aside>
    </main>
  </body>
</html>
