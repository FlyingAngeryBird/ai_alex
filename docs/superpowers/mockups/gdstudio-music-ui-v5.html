<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lingmo 音乐播放 UI 稿 v5</title>
    <style>
      :root {
        color: #f8f4ea;
        background: #07080d;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          linear-gradient(118deg, rgba(255, 218, 118, 0.075), transparent 34%),
          linear-gradient(242deg, rgba(0, 214, 200, 0.095), transparent 38%),
          linear-gradient(180deg, #0a0b11 0%, #05060a 58%, #09070b 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), transparent 72%);
      }

      button,
      input {
        color: inherit;
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .music-view {
        position: relative;
        width: 100vw;
        min-width: 900px;
        height: 100vh;
        min-height: 640px;
        padding: 30px 40px 36px;
        overflow: hidden;
      }

      .particle-stage {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .particle-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .particle-core {
        position: absolute;
        top: 8.8%;
        left: 50%;
        width: min(38vw, 430px);
        aspect-ratio: 1;
        border-radius: 999px;
        transform: translateX(-50%);
      }

      .particle-core::before,
      .particle-core::after {
        position: absolute;
        content: "";
        border-radius: 999px;
      }

      .particle-core::before {
        inset: -8%;
        border: 1px solid rgba(143, 228, 203, 0.12);
        transform: rotate(-18deg) scaleX(1.18);
      }

      .particle-core::after {
        inset: -16%;
        border: 1px solid rgba(255, 225, 111, 0.075);
        box-shadow:
          0 0 28px rgba(255, 225, 111, 0.045),
          inset 0 0 40px rgba(0, 213, 200, 0.035);
        transform: rotate(25deg) scaleX(1.26);
      }

      .pulse-line {
        position: absolute;
        left: 50%;
        top: calc(8.8% + min(19vw, 215px));
        width: min(48vw, 560px);
        height: 1px;
        transform: translateX(-50%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 213, 200, 0.08),
          rgba(255, 225, 111, 0.13),
          rgba(0, 213, 200, 0.08),
          transparent
        );
      }

      .music-topbar {
        position: relative;
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
      }

      .top-left {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 42px;
      }

      .round-button,
      .exit-button,
      .source-chip,
      .search-button,
      .icon-play-button {
        border: 1px solid rgba(255, 255, 255, 0.13);
        backdrop-filter: blur(18px);
      }

      .round-button,
      .icon-play-button,
      .search-button {
        display: grid;
        place-items: center;
      }

      .round-button {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        color: #fff8e6;
        background: rgba(255, 255, 255, 0.055);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 225, 111, 0.17);
        border-radius: 999px;
        color: rgba(255, 248, 230, 0.9);
        background: rgba(255, 225, 111, 0.065);
        font-size: 0.76rem;
        backdrop-filter: blur(18px);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ffe16f;
        box-shadow: 0 0 14px rgba(255, 225, 111, 0.86);
      }

      .exit-button {
        height: 34px;
        min-width: 64px;
        padding: 0 12px;
        border-radius: 12px;
        color: rgba(255, 248, 230, 0.92);
        background: rgba(255, 143, 100, 0.105);
        font-size: 0.78rem;
      }

      .search-glass {
        width: 426px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.082);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.052), rgba(255, 255, 255, 0.012)),
          rgba(7, 8, 12, 0.18);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          0 14px 34px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(24px) saturate(1.18);
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 32px;
        gap: 7px;
        align-items: center;
      }

      .search-field {
        min-width: 0;
        height: 31px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        color: #f8f4ea;
        background: rgba(255, 255, 255, 0.034);
        outline: none;
      }

      .search-field::placeholder {
        color: rgba(232, 229, 216, 0.45);
      }

      .search-button {
        width: 32px;
        height: 31px;
        border-radius: 10px;
        color: #07100f;
        background: rgba(169, 240, 223, 0.68);
        font-weight: 700;
      }

      .source-row {
        display: flex;
        gap: 5px;
        margin-top: 7px;
      }

      .source-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 54px;
        height: 23px;
        padding: 0 8px;
        border-radius: 999px;
        color: rgba(220, 215, 202, 0.7);
        background: rgba(255, 255, 255, 0.032);
        font-size: 0.68rem;
      }

      .source-chip[data-active="true"] {
        border-color: rgba(255, 225, 111, 0.31);
        color: #fff4d4;
        background: rgba(255, 225, 111, 0.09);
      }

      .music-layout {
        position: absolute;
        z-index: 3;
        left: clamp(40px, 7vw, 118px);
        right: clamp(40px, 7vw, 118px);
        bottom: clamp(36px, 8vh, 78px);
        display: grid;
        grid-template-columns: 98px minmax(300px, 460px) minmax(300px, 420px);
        align-items: end;
        justify-content: center;
        gap: clamp(22px, 4vw, 62px);
      }

      .cover-art {
        position: relative;
        width: 92px;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background:
          linear-gradient(145deg, rgba(255, 225, 111, 0.78), rgba(255, 111, 145, 0.57) 46%, rgba(0, 213, 200, 0.7)),
          #151512;
        box-shadow: 0 20px 58px rgba(0, 0, 0, 0.34);
      }

      .cover-art::before {
        position: absolute;
        inset: 18%;
        content: "";
        border: 1px solid rgba(5, 6, 10, 0.18);
        border-radius: 999px;
        background:
          radial-gradient(circle, rgba(5, 6, 10, 0.18) 0 9%, transparent 10%),
          repeating-radial-gradient(circle, rgba(5, 6, 10, 0.16) 0 1px, transparent 2px 10px);
      }

      .cover-label {
        display: block;
        width: 92px;
        margin-top: 9px;
        color: rgba(232, 229, 216, 0.48);
        font-size: 0.68rem;
        line-height: 1.32;
      }

      .music-copy {
        min-width: 0;
        padding-bottom: 2px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #96ded5;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        max-width: 100%;
        color: #fff5dc;
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(1.55rem, 2.65vw, 2.28rem);
        font-weight: 650;
        line-height: 1.05;
        overflow-wrap: anywhere;
      }

      .artist {
        margin-top: 8px;
        color: #c8d0c8;
        font-size: 0.92rem;
      }

      .progress-block {
        margin-top: 20px;
      }

      .progress-track {
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.105);
      }

      .progress-track span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #ffe16f;
        box-shadow: 0 0 14px rgba(255, 225, 111, 0.42);
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        color: #9ea79f;
        font-size: 0.72rem;
      }

      .control-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 15px;
      }

      .icon-play-button {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        color: #fff8e6;
        background: rgba(255, 255, 255, 0.058);
      }

      .pause-bars {
        display: grid;
        grid-template-columns: 3px 3px;
        gap: 4px;
      }

      .pause-bars span {
        width: 3px;
        height: 12px;
        border-radius: 999px;
        background: #fff8e6;
      }

      .source-note {
        color: rgba(232, 229, 216, 0.46);
        font-size: 0.7rem;
      }

      .lyrics {
        min-width: 0;
        padding-bottom: 4px;
      }

      .lyric-label {
        margin: 0 0 18px;
        color: rgba(150, 222, 213, 0.72);
        font-size: 0.64rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .lyric-stack {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .lyric-line {
        margin: 0;
        color: rgba(232, 229, 216, 0.38);
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
        font-size: clamp(0.98rem, 1.28vw, 1.18rem);
        line-height: 1.46;
        overflow-wrap: anywhere;
      }

      .lyric-line[data-current="true"] {
        color: #fff4d4;
        font-size: clamp(1.34rem, 1.9vw, 1.68rem);
        line-height: 1.24;
        text-shadow: 0 0 22px rgba(255, 225, 111, 0.22);
      }

      .lyric-line[data-next="true"] {
        color: rgba(232, 229, 216, 0.52);
      }

      @media (max-width: 980px) {
        .music-view {
          min-width: 0;
          padding: 22px 24px 28px;
        }

        .music-topbar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .search-glass {
          width: calc(100vw - 48px);
        }

        .particle-core {
          width: min(58vw, 360px);
        }

        .music-layout {
          left: 24px;
          right: 24px;
          bottom: 28px;
          grid-template-columns: 78px minmax(220px, 1fr);
          gap: 18px;
        }

        .cover-art,
        .cover-label {
          width: 74px;
        }

        .lyrics {
          grid-column: 1 / -1;
          width: min(520px, 100%);
          margin-top: 18px;
        }
      }

      @media (max-height: 720px) {
        .particle-core {
          top: 7%;
          width: min(32vw, 330px);
        }

        .music-layout {
          bottom: 28px;
        }

        .lyric-stack {
          gap: 7px;
        }

        .lyric-line {
          font-size: 0.94rem;
          line-height: 1.34;
        }

        .lyric-line[data-current="true"] {
          font-size: 1.28rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="music-view">
      <div class="particle-stage" aria-hidden="true">
        <div class="particle-core"></div>
        <div class="pulse-line"></div>
        <canvas class="particle-canvas" id="particleCanvas" aria-hidden="true"></canvas>
      </div>

      <header class="music-topbar">
        <div class="top-left">
          <button class="round-button" type="button" aria-label="返回聊天">←</button>
          <div class="status-pill"><span class="status-dot"></span>Playing</div>
          <button class="exit-button" type="button">退出</button>
        </div>

        <section class="search-glass" aria-label="歌曲搜索">
          <div class="search-row">
            <input class="search-field" value="稻香 周杰伦" aria-label="搜索歌曲、歌手或专辑" />
            <button class="search-button" type="button" aria-label="搜索">⌕</button>
          </div>
          <div class="source-row" aria-label="音源选择">
            <button class="source-chip" data-active="true" type="button">全部</button>
            <button class="source-chip" type="button">netease</button>
            <button class="source-chip" type="button">kuwo</button>
            <button class="source-chip" type="button">joox</button>
          </div>
        </section>
      </header>

      <section class="music-layout" aria-label="音乐播放">
        <div class="cover-frame">
          <div class="cover-art" aria-label="专辑封面"></div>
          <span class="cover-label">魔杰座</span>
        </div>

        <section class="music-copy" aria-label="当前歌曲">
          <p class="eyebrow">GD Studio · joox</p>
          <h1>稻香</h1>
          <p class="artist">周杰伦</p>
          <div class="progress-block">
            <div class="progress-track" aria-hidden="true"><span></span></div>
            <div class="time-row"><span>1:24</span><span>3:43</span></div>
          </div>
          <div class="control-row">
            <button class="icon-play-button" type="button" aria-label="暂停">
              <span class="pause-bars" aria-hidden="true"><span></span><span></span></span>
            </button>
            <span class="source-note">柔和播放中</span>
          </div>
        </section>

        <aside class="lyrics" aria-label="同步歌词">
          <p class="lyric-label">同步歌词</p>
          <div class="lyric-stack">
            <p class="lyric-line">对这个世界如果你有太多的抱怨</p>
            <p class="lyric-line">跌倒了就不敢继续往前走</p>
            <p class="lyric-line" data-current="true">为什么人要这么的脆弱堕落</p>
            <p class="lyric-line" data-next="true">请你打开电视看看</p>
            <p class="lyric-line">多少人为生命在努力勇敢的走下去</p>
          </div>
        </aside>
      </section>
    </main>
    <script>
      const canvas = document.getElementById("particleCanvas");
      const context = canvas.getContext("2d");
      const points = [];
      const count = 2400;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let index = 0; index < count; index += 1) {
        const y = 1 - (index / (count - 1)) * 2;
        const radius = Math.sqrt(1 - y * y);
        const theta = goldenAngle * index;
        points.push({
          x: Math.cos(theta) * radius,
          y,
          z: Math.sin(theta) * radius,
          phase: Math.random() * Math.PI * 2,
          tint: Math.random()
        });
      }

      function resize() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * ratio);
        canvas.height = Math.floor(window.innerHeight * ratio);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function mix(start, end, t) {
        return Math.round(start + (end - start) * t);
      }

      function colorFor(point, depth) {
        const teal = [0, 213, 200];
        const cream = [255, 247, 230];
        const gold = [255, 225, 111];
        const target = point.tint > 0.82 ? gold : cream;
        const blend = point.tint > 0.82 ? 0.45 : 0.32 + depth * 0.22;
        return `rgb(${mix(teal[0], target[0], blend)}, ${mix(teal[1], target[1], blend)}, ${mix(teal[2], target[2], blend)})`;
      }

      function draw(time) {
        const seconds = time / 1000;
        const width = window.innerWidth;
        const height = window.innerHeight;
        const centerX = width / 2;
        const centerY = Math.max(210, height * 0.29);
        const sphereRadius = Math.min(width * 0.19, 222);
        const breath = 1 + Math.sin(seconds * 1.55) * 0.028;
        const rotationY = seconds * 0.18;
        const rotationX = -0.18 + Math.sin(seconds * 0.35) * 0.025;

        context.clearRect(0, 0, width, height);

        const sorted = points
          .map((point) => {
            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const rotatedX = point.x * cosY - point.z * sinY;
            const rotatedZ = point.x * sinY + point.z * cosY;
            const rotatedY = point.y * cosX - rotatedZ * sinX;
            const finalZ = point.y * sinX + rotatedZ * cosX;
            return { point, x: rotatedX, y: rotatedY, z: finalZ };
          })
          .sort((a, b) => a.z - b.z);

        for (const item of sorted) {
          const depth = (item.z + 1) / 2;
          const perspective = 0.84 + depth * 0.18;
          const drift = Math.sin(seconds * 1.2 + item.point.phase) * 1.2;
          const x = centerX + item.x * sphereRadius * breath * perspective + drift;
          const y = centerY + item.y * sphereRadius * breath * perspective + drift * 0.35;
          const alpha = 0.2 + depth * 0.72;
          const size = 0.8 + depth * 1.05;

          context.globalAlpha = alpha;
          context.fillStyle = colorFor(item.point, depth);
          context.beginPath();
          context.arc(x, y, size, 0, Math.PI * 2);
          context.fill();
        }

        context.globalAlpha = 1;
        window.requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener("resize", resize);
      window.requestAnimationFrame(draw);
    </script>
  </body>
</html>
