<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex — 智能语音助手</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 虚空底色 */
            --void: #0A0A0F;
            --void-deep: #050508;
            --void-mid: #0D0D14;

            /* 状态色彩 */
            --warm-white: #FFF5E0;
            --gold: #FFD700;
            --neon-purple: #B44DFF;
            --neon-pink: #FF2D7B;
            --emerald: #00E5A0;
            --aurora: #00D4FF;
            --electric-blue: #4488FF;
            --ice-white: #EEF0FF;

            /* 文字层级 */
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0C0;
            --text-tertiary: #707080;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 虚空径向渐变：中心微亮，边缘沉入绝对黑暗 */
            background: radial-gradient(ellipse at center,
                var(--void-mid) 0%,
                var(--void) 55%,
                var(--void-deep) 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            cursor: default;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #canvas-container canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        //  常量定义
        // ============================================================
        const PARTICLE_COUNT = 8000;       // 粒子总数
        const SPHERE_RADIUS  = 1.2;        // 球体基准半径（3D 单位）
        const FRUSTUM_SIZE   = 3.5;        // 正交相机半高
        const PARTICLE_SIZE  = 2.2;        // 粒子像素大小（粉尘级细腻）

        // ============================================================
        //  状态枚举
        // ============================================================
        const State = {
            SLEEP:     0,
            WAKE:      1,
            LISTENING: 2,
            THINKING:  3,
            SPEAKING:  4,
            OUTRO:     5
        };

        // ============================================================
        //  缓动函数集
        //  将线性过渡进度 0→1 映射为非线性曲线，驱动状态过渡引擎
        // ============================================================
        const Easing = {
            // ease-out-cubic：先快后慢，自然收敛
            easeOutCubic: x => 1 - Math.pow(1 - x, 3),
            // ease-in-out-cubic：对称缓动，进出都柔和
            easeInOutCubic: x => x < 0.5
                ? 4 * x * x * x
                : 1 - Math.pow(-2 * x + 2, 3) / 2,
            // ease-out-back：末端过冲回弹，粒子"砸"入目标位
            easeOutBack: x => {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
            },
            // ease-out-elastic：弹性振荡衰减，富有生命感的弹跳入场
            easeOutElastic: x => {
                const c4 = (2 * Math.PI) / 3;
                if (x === 0) return 0;
                if (x === 1) return 1;
                return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
            }
        };

        // ============================================================
        //  六状态参数表
        //  每个状态定义：行为模式、色彩端点、缩放、粒子尺寸、
        //  透明度，以及过渡到该状态所用的缓动曲线与时长
        // ============================================================
        const STATE_PARAMS = {
            [State.SLEEP]: {
                behavior:   'static',
                colorA:     '#0a0a0f',
                colorB:     '#0a0a0f',
                scale:      0.0,
                opacity:    0.0,
                size:       1.5,
                duration:   1.5,
                ease:       Easing.easeOutCubic
            },
            [State.WAKE]: {
                behavior:   'breath',
                colorA:     '#FFF5E0',     // 暖白
                colorB:     '#FFD700',     // 亮金
                scale:      1.0,
                opacity:    1.0,
                size:       2.2,
                duration:   2.6,           // 舒缓收敛：像潮水缓缓涌来
                ease:       Easing.easeInOutCubic   // 慢启动→聚拢→柔落定，丝滑无回弹
            },
            [State.LISTENING]: {
                behavior:   'ripple',
                colorA:     '#B44DFF',     // 霓虹紫
                colorB:     '#FF2D7B',     // 玫红
                scale:      0.85,
                opacity:    1.0,
                size:       2.0,
                duration:   0.8,
                ease:       Easing.easeInOutCubic
            },
            [State.THINKING]: {
                behavior:   'vortex',
                colorA:     '#00E5A0',     // 翡翠绿
                colorB:     '#00D4FF',     // 极光青
                scale:      0.75,
                opacity:    1.0,
                size:       1.8,
                duration:   0.9,
                ease:       Easing.easeInOutCubic
            },
            [State.SPEAKING]: {
                behavior:   'pulse',
                colorA:     '#4488FF',     // 电子蓝
                colorB:     '#EEF0FF',     // 纯白
                scale:      1.15,
                opacity:    1.0,
                size:       2.6,
                duration:   1.1,
                ease:       Easing.easeOutElastic
            },
            [State.OUTRO]: {
                behavior:   'dissipate',
                colorA:     '#FFD700',     // 暖金
                colorB:     '#1a0500',     // 极暗暖色（additive 下≈透明）
                scale:      1.0,
                opacity:    1.0,
                size:       2.0,
                duration:   1.6,
                ease:       Easing.easeInOutCubic
            }
        };

        // ============================================================
        //  全局对象
        // ============================================================
        let scene, camera, renderer, particles, clock;

        // ---- 粒子数据（Float32Array，GPU 友好）----
        // 渲染缓冲（传给 BufferGeometry）
        let positions;        // 当前渲染位置 = basePositions + 行为偏移
        let colors;           // 当前颜色

        // Lerp 系统（当前值 → 目标值）
        let basePositions;    // 基础位置（lerp 插值用，不含行为偏移）
        let targetPositions;  // 目标位置
        let targetColors;     // 目标颜色

        // 逐粒子基础属性
        let particleDirs;     // 单位方向向量 (count*3)
        let particlePhase;    // 微颤相位
        let particleSpeed;    // 微颤速度
        let particleColorT;   // 颜色插值因子 0..1（colorA→colorB）
        let particleScatter;  // OUTRO 扩散距离因子
        let particleSwirl;    // THINKING 涡流角速度累积器（差分旋转相位）

        // ---- 状态机运行时 ----
        let currentState        = State.SLEEP;
        let behaviorScale       = 0.0;     // 当前整体缩放（过渡到 target）
        let behaviorScaleTarget = 0.0;
        let materialOpacity     = 0.0;
        let targetOpacity       = 0.0;
        let targetSize          = 1.5;     // 目标粒子像素尺寸

        // ---- 状态过渡引擎 ----
        // 每次 setState 捕获当前渲染态作为起点，按缓动曲线在固定时长内
        // 批量 Lerp 位置 / 颜色 / 缩放 / 透明度 / 粒子尺寸，杜绝突变
        const transition = {
            active:        false,
            elapsed:       0,
            duration:      1.0,
            easing:        null,
            fromPositions: null,
            fromColors:    null,
            fromScale:     0,
            fromOpacity:   0,
            fromSize:      0
        };

        // ============================================================
        //  音频模拟器
        //  生成拟真的伪振幅（LISTENING 表面波动）与伪 FFT 频谱（SPEAKING 脉冲）
        //  - 振幅：基础呼吸 + 随机音节脉冲包络 + 微噪声，低通平滑
        //  - FFT：64 频段，1/f 频谱衰减 + 逐频段独立相位 + 音节低频增强
        //  - 60fps 更新：每帧 update() 预算数据，粒子循环只读取
        // ============================================================
        const FFT_BINS = 64;

        const audioSimulator = {
            amplitude:    0,                          // 平滑后振幅 0..1（供 LISTENING）
            amplitudeRaw: 0,                           // 原始振幅（含脉冲）
            fft:          new Float32Array(FFT_BINS), // 频谱 0..∞（供 SPEAKING）
            _fftPhase:    new Float32Array(FFT_BINS),
            _fftFreq:     new Float32Array(FFT_BINS),
            _noiseLP:     0,                           // 噪声低通状态
            _nextSyllable: 1.2,                        // 下一个音节触发时间
            _syllableEnv: 0,                           // 当前音节包络（指数衰减）
            _syllableLow: 0,                           // 音节低频增强因子

            init() {
                for (let i = 0; i < FFT_BINS; i++) {
                    this._fftPhase[i] = Math.random() * Math.PI * 2;
                    this._fftFreq[i]  = 0.5 + Math.random() * 2.5;  // 各频段独立起伏频率
                }
            },

            _triggerSyllable(t) {
                this._syllableEnv  = 0.7 + Math.random() * 0.3;     // 音节强度
                this._syllableLow  = 1.0;                            // 低频增强启动
                this._nextSyllable = t + 0.35 + Math.random() * 0.55; // 下一个音节间隔
            },

            update(t, dt) {
                // ---- 音节脉冲调度：模拟人说话的音节节奏 ----
                if (t >= this._nextSyllable) this._triggerSyllable(t);
                this._syllableEnv *= Math.exp(-dt * 6.0);  // 包络快速衰减
                this._syllableLow *= Math.exp(-dt * 3.0);  // 低频余韵稍长

                // ---- 基础呼吸：慢速起伏 ----
                const baseBreath = 0.18 + Math.sin(t * 1.8) * 0.06 + Math.sin(t * 0.7) * 0.04;

                // ---- 微噪声 + 低通：避免过于规则 ----
                const noise = (Math.random() - 0.5) * 0.5;
                this._noiseLP += (noise - this._noiseLP) * Math.min(1, dt * 12);

                // ---- 原始振幅 = 呼吸 + 音节脉冲 + 噪声 ----
                this.amplitudeRaw = Math.max(0,
                    baseBreath + this._syllableEnv * 0.55 + this._noiseLP * 0.08);
                this.amplitudeRaw = Math.min(1, this.amplitudeRaw);

                // ---- 低通平滑振幅（消除跳变，丝滑过渡）----
                this.amplitude += (this.amplitudeRaw - this.amplitude) * Math.min(1, dt * 10);

                // ---- FFT 频谱：1/f 衰减形状 + 逐频段起伏 + 音节低频增强 ----
                for (let i = 0; i < FFT_BINS; i++) {
                    const norm = i / (FFT_BINS - 1);                // 0..1 低→高
                    const spectralShape = Math.pow(1 - norm, 1.5);  // 低频强、高频弱
                    const wobble = 0.5 + 0.5 * Math.sin(t * this._fftFreq[i] + this._fftPhase[i]);
                    const lowBoost = this._syllableLow * Math.pow(1 - norm, 3) * 0.6;
                    this.fft[i] = Math.max(0,
                        spectralShape * wobble * this.amplitude + lowBoost);
                }
            },

            // 粒子按索引映射到 FFT 频段
            getFFTForParticle(i) {
                return this.fft[i % FFT_BINS];
            }
        };

        // ============================================================
        //  场景初始化
        // ============================================================
        function initScene() {
            scene = new THREE.Scene();
        }

        // ============================================================
        //  正交相机初始化
        // ============================================================
        function initCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(
                -FRUSTUM_SIZE * aspect,
                 FRUSTUM_SIZE * aspect,
                 FRUSTUM_SIZE,
                -FRUSTUM_SIZE,
                 0.1,
                 100
            );
            camera.position.set(0, 0, 10);
            camera.lookAt(0, 0, 0);
        }

        // ============================================================
        //  WebGL 渲染器初始化
        // ============================================================
        function initRenderer() {
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
        }

        // ============================================================
        //  Canvas 生成圆形发光精灵贴图
        // ============================================================
        function createGlowTexture() {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width  = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const center = size / 2;
            const gradient = ctx.createRadialGradient(
                center, center, 0,
                center, center, center
            );
            gradient.addColorStop(0.00, 'rgba(255, 255, 255, 1.00)');
            gradient.addColorStop(0.15, 'rgba(255, 255, 255, 0.85)');
            gradient.addColorStop(0.35, 'rgba(255, 255, 255, 0.40)');
            gradient.addColorStop(0.65, 'rgba(255, 255, 255, 0.08)');
            gradient.addColorStop(1.00, 'rgba(255, 255, 255, 0.00)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // ============================================================
        //  粒子系统初始化
        //  生成逐粒子基础数据 + 初始化为 SLEEP → 触发 WAKE
        // ============================================================
        function createParticleSystem() {
            const geometry = new THREE.BufferGeometry();

            // 分配所有缓冲
            positions       = new Float32Array(PARTICLE_COUNT * 3);
            colors          = new Float32Array(PARTICLE_COUNT * 3);
            basePositions   = new Float32Array(PARTICLE_COUNT * 3);
            targetPositions = new Float32Array(PARTICLE_COUNT * 3);
            targetColors    = new Float32Array(PARTICLE_COUNT * 3);
            particleDirs    = new Float32Array(PARTICLE_COUNT * 3);
            particlePhase   = new Float32Array(PARTICLE_COUNT);
            particleSpeed   = new Float32Array(PARTICLE_COUNT);
            particleColorT  = new Float32Array(PARTICLE_COUNT);
            particleScatter = new Float32Array(PARTICLE_COUNT);
            particleSwirl   = new Float32Array(PARTICLE_COUNT);   // 默认 0

            // Fibonacci 球面方向——均匀覆盖、无极点聚集
            const phi = Math.PI * (Math.sqrt(5) - 1);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const y = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
                const r = Math.sqrt(Math.max(0, 1 - y * y));
                const theta = phi * i;

                // 单位方向向量
                const dx = Math.cos(theta) * r;
                const dy = y;
                const dz = Math.sin(theta) * r;
                particleDirs[i * 3]     = dx;
                particleDirs[i * 3 + 1] = dy;
                particleDirs[i * 3 + 2] = dz;

                // 逐粒子基础属性
                particlePhase[i]   = Math.random() * Math.PI * 2;
                particleSpeed[i]   = 0.5 + Math.random() * 1.2;
                particleColorT[i]  = Math.random();                    // 颜色随机插值
                particleScatter[i] = 0.5 + Math.random() * 1.5;        // OUTRO 扩散因子
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size:             PARTICLE_SIZE,
                map:              createGlowTexture(),
                vertexColors:     true,
                transparent:      true,
                opacity:          0.0,
                blending:         THREE.AdditiveBlending,
                depthWrite:       false,
                depthTest:        false,
                sizeAttenuation:  false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // 初始化为 SLEEP 分布，然后触发 WAKE 收敛动画
            currentState = State.SLEEP;
            behaviorScale = 0.0;
            behaviorScaleTarget = 0.0;
            materialOpacity = 0.0;
            targetOpacity = 0.0;
            targetSize = STATE_PARAMS[State.SLEEP].size;
            particles.material.size = targetSize;

            generateStateTargets(State.SLEEP);
            basePositions.set(targetPositions);
            positions.set(targetPositions);
            colors.set(targetColors);

            // 触发苏醒入场
            setState(State.WAKE);
        }

        // ============================================================
        //  状态目标生成器
        //  为指定状态计算所有粒子的 targetPositions 和 targetColors
        // ============================================================
        function generateStateTargets(state) {
            const params = STATE_PARAMS[state];
            const colA = new THREE.Color(params.colorA);
            const colB = new THREE.Color(params.colorB);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const dx = particleDirs[i3];
                const dy = particleDirs[i3 + 1];
                const dz = particleDirs[i3 + 2];
                const t  = particleColorT[i];

                // ---- 目标颜色：colorA → colorB 按 particleColorT 插值 ----
                targetColors[i3]     = colA.r + (colB.r - colA.r) * t;
                targetColors[i3 + 1] = colA.g + (colB.g - colA.g) * t;
                targetColors[i3 + 2] = colA.b + (colB.b - colA.b) * t;

                // ---- 目标位置：按状态分布 ----
                switch (state) {
                    case State.SLEEP: {
                        // 散布到远处虚空，不可见
                        const r = SPHERE_RADIUS * (3.0 + particleScatter[i] * 2.5);
                        targetPositions[i3]     = dx * r;
                        targetPositions[i3 + 1] = dy * r;
                        targetPositions[i3 + 2] = dz * r;
                        break;
                    }
                    case State.WAKE: {
                        // 收敛到球面 + 极薄厚度扰动（消除硬壳感）
                        const thickness = 1.0 + (Math.random() - 0.5) * 0.06;
                        const r = SPHERE_RADIUS * thickness;
                        targetPositions[i3]     = dx * r;
                        targetPositions[i3 + 1] = dy * r;
                        targetPositions[i3 + 2] = dz * r;
                        break;
                    }
                    case State.LISTENING: {
                        // 球壳微缩 + 表面噪声偏移
                        const noise = (Math.random() - 0.5) * 0.05;
                        const r = SPHERE_RADIUS * 0.85 * (1.0 + noise);
                        targetPositions[i3]     = dx * r;
                        targetPositions[i3 + 1] = dy * r;
                        targetPositions[i3 + 2] = dz * r;
                        break;
                    }
                    case State.THINKING: {
                        // 扁平涡盘：Y 强压缩成盘状 + 极薄厚度
                        // 动态涡旋完全交给差分角速度流场（见 animate 'vortex'）
                        const radH = Math.sqrt(dx * dx + dz * dz);    // 水平半径 0..1
                        const flatY = dy * 0.30;                      // Y 轴强压缩（盘状）
                        const r = SPHERE_RADIUS * 0.78;
                        const thickness = (Math.random() - 0.5) * 0.06;
                        targetPositions[i3]     = dx * r * (1.0 + thickness);
                        targetPositions[i3 + 1] = flatY * r;
                        targetPositions[i3 + 2] = dz * r * (1.0 + thickness);
                        break;
                    }
                    case State.SPEAKING: {
                        // 球壳稍大 + 微厚度
                        const thickness = 1.0 + (Math.random() - 0.5) * 0.04;
                        const r = SPHERE_RADIUS * 1.15 * thickness;
                        targetPositions[i3]     = dx * r;
                        targetPositions[i3 + 1] = dy * r;
                        targetPositions[i3 + 2] = dz * r;
                        break;
                    }
                    case State.OUTRO: {
                        // 从球面向外扩散
                        const r = SPHERE_RADIUS * (1.0 + particleScatter[i] * 2.8);
                        targetPositions[i3]     = dx * r;
                        targetPositions[i3 + 1] = dy * r;
                        targetPositions[i3 + 2] = dz * r;
                        break;
                    }
                }
            }
        }

        // ============================================================
        //  状态切换
        // ============================================================
        function setState(state) {
            if (state === currentState) return;
            // 捕获当前渲染态作为过渡起点（位置/颜色/缩放/透明度/尺寸）
            transition.fromPositions = new Float32Array(basePositions);
            transition.fromColors    = new Float32Array(colors);
            transition.fromScale     = behaviorScale;
            transition.fromOpacity   = materialOpacity;
            transition.fromSize      = particles.material.size;

            currentState = state;
            const params = STATE_PARAMS[state];
            behaviorScaleTarget = params.scale;
            targetOpacity       = params.opacity;
            targetSize          = params.size;
            transition.duration = params.duration;
            transition.easing   = params.ease;
            transition.elapsed  = 0;
            transition.active   = true;

            generateStateTargets(state);
        }

        // ============================================================
        //  动画循环
        //  统一 render loop：缓动过渡引擎 + 行为偏移 + 整体变换
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);  // cap delta 防止 tab 切换跳变
            const t  = clock.getElapsedTime();

            // 音频模拟器 60fps 更新：预算振幅与 FFT 频谱供行为层读取
            audioSimulator.update(t, dt);

            // ---- 状态过渡引擎：缓动曲线驱动的批量 Lerp ----
            if (transition.active) {
                transition.elapsed += dt;
                let p = transition.elapsed / transition.duration;
                if (p >= 1) { p = 1; transition.active = false; }
                const e  = transition.easing(p);   // 非线性进度
                const ie = 1 - e;
                const fp = transition.fromPositions;
                const fc = transition.fromColors;
                const n3 = PARTICLE_COUNT * 3;
                for (let i = 0; i < n3; i++) {
                    basePositions[i] = fp[i] * ie + targetPositions[i] * e;
                    colors[i]        = fc[i] * ie + targetColors[i] * e;
                }
                behaviorScale         = transition.fromScale   * ie + behaviorScaleTarget * e;
                materialOpacity       = transition.fromOpacity * ie + targetOpacity       * e;
                particles.material.size = transition.fromSize  * ie + targetSize          * e;
            } else {
                // 过渡结束：吸附目标位置，防止浮点漂移
                basePositions.set(targetPositions);
            }
            particles.material.opacity = materialOpacity;

            // ---- 逐粒子行为偏移（叠加在基础位置之上，不污染过渡 lerp）----
            const params   = STATE_PARAMS[currentState];
            const behavior = params.behavior;
            const amp      = (behavior === 'ripple') ? audioSimulator.amplitude : 0;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const bx = basePositions[i3];
                const by = basePositions[i3 + 1];
                const bz = basePositions[i3 + 2];
                let ox = 0, oy = 0, oz = 0;

                switch (behavior) {
                    case 'breath': {
                        // 微颤：活体颤动感
                        const dx = particleDirs[i3], dy = particleDirs[i3 + 1], dz = particleDirs[i3 + 2];
                        const w = Math.sin(t * particleSpeed[i] + particlePhase[i]) * 0.012;
                        ox = dx * w; oy = dy * w; oz = dz * w;
                        break;
                    }
                    case 'ripple': {
                        // 多频方向相干干涉——类克拉尼驻波 / 算法艺术分层噪声场
                        // 用粒子方向投影作空间坐标，叠加三频正弦形成有机节点图样
                        const dx = particleDirs[i3], dy = particleDirs[i3 + 1], dz = particleDirs[i3 + 2];
                        const proj = dx * 0.7
                                   + dy * (0.5 + 0.3 * Math.sin(t * 0.4))
                                   + dz * (0.6 - 0.3 * Math.cos(t * 0.3));
                        const wave = Math.sin(proj * 5.0 + t * 2.5) * 0.45
                                   + Math.sin(proj * 9.0 - t * 1.7) * 0.30
                                   + Math.sin(proj * 14.0 + t * 3.3) * 0.18;
                        const radial = wave * amp * 0.07;
                        // 高频闪烁：每粒子独立相位的微颤
                        const shim = Math.sin(t * 9.0 + particlePhase[i] * 3.0) * 0.004;
                        const off = radial + shim;
                        ox = dx * off; oy = dy * off; oz = dz * off;
                        break;
                    }
                    case 'vortex': {
                        // 差分角速度流场——算法艺术的旋转力场
                        // 角速度 ∝ 1/(r+ε)：内层急转、外层缓旋，形成星系式剪流
                        const radH = Math.sqrt(bx * bx + bz * bz);
                        const ang  = Math.atan2(bz, bx);
                        const omega = 1.6 + 2.0 / (radH + 0.35);
                        particleSwirl[i] += omega * dt;
                        const newAng = ang + particleSwirl[i];
                        ox = Math.cos(newAng) * radH - bx;
                        oz = Math.sin(newAng) * radH - bz;
                        // 垂向起伏：赋予涡流 3D 厚度的生命感
                        oy = Math.sin(t * 1.8 + particlePhase[i]) * 0.05;
                        break;
                    }
                    case 'pulse': {
                        // 脉冲：FFT 频谱驱动径向扩张
                        const dx = particleDirs[i3], dy = particleDirs[i3 + 1], dz = particleDirs[i3 + 2];
                        const fft = audioSimulator.getFFTForParticle(i);
                        const wave = fft * 0.035;
                        ox = dx * wave; oy = dy * wave; oz = dz * wave;
                        break;
                    }
                    // static / dissipate：无逐粒子偏移，靠整体变换
                }

                positions[i3]     = bx + ox;
                positions[i3 + 1] = by + oy;
                positions[i3 + 2] = bz + oz;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;

            // ---- 整体行为变换 ----
            let extraScale = 1.0;
            switch (behavior) {
                case 'breath':
                    extraScale = 1.0 + Math.sin(t * Math.PI * 0.5) * 0.03;
                    particles.rotation.y = t * 0.15;
                    particles.rotation.x = Math.sin(t * 0.1) * 0.1;
                    break;
                case 'ripple':
                    particles.rotation.y = t * 0.1;
                    break;
                case 'vortex':
                    // 整体缓慢旋转作为构图衬底（主旋转让给差分流场）
                    particles.rotation.y = t * 0.25;
                    particles.rotation.x = Math.sin(t * 0.15) * 0.12;
                    break;
                case 'pulse':
                    extraScale = 1.0 + Math.sin(t * 5.0) * 0.06;
                    particles.rotation.y = t * 0.15;
                    break;
                case 'dissipate':
                    particles.rotation.y = t * 0.3;
                    break;
                case 'static':
                    break;
            }

            particles.scale.setScalar(behaviorScale * extraScale);

            renderer.render(scene, camera);
        }

        // ============================================================
        //  窗口大小调整
        // ============================================================
        function onResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left   = -FRUSTUM_SIZE * aspect;
            camera.right  =  FRUSTUM_SIZE * aspect;
            camera.top    =  FRUSTUM_SIZE;
            camera.bottom = -FRUSTUM_SIZE;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        // ============================================================
        //  初始化入口
        // ============================================================
        function init() {
            clock = new THREE.Clock();

            initScene();
            initCamera();
            initRenderer();
            audioSimulator.init();
            createParticleSystem();

            window.addEventListener('resize', onResize);
            animate();
        }

        // 暴露 API 供控制面板/控制台调用
        window.Alex = { State, Easing, setState, getState: () => currentState };

        init();
    </script>
</body>
</html>
