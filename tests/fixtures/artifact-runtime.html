<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Seamo Artifact Runtime Check</title></head><body><div id="app"></div><script type="module">
import { createApp, h, ref } from 'vue'
import Editor from '../../src/components/R1ArtifactEditor.vue'
import '../../src/r1-shell.css'
createApp({ setup() {
 const records = ref('尚未读取')
 return () => h('main', { class: 'r1-shell', style: 'padding:32px;position:relative;min-height:100vh' }, [

 h('pre', { style: 'white-space:pre-wrap', 'aria-label': '数据库记录' }, records.value)
 ])
} }).mount('#app')
</script></body></html>
